name: Weekly Data Pipeline

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 6:00 AM UTC
  workflow_dispatch:       # Allow manual trigger via GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Data Pipeline
        run: |
          python pipeline.py --input data/raw/raw_transactions.csv --output output

      - name: Commit Updated Output
        run: |
          git config user.name "SalesPulse Pipeline Bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add output/
          git commit -m "pipeline: automated data refresh" || echo "No changes to commit"
          git push
